[package]
name = "rami"
version = "0.1.2"
edition = "2021"
description = "Restrained macOS menu bar system monitor for memory, CPU, and GPU."
license = "MIT"
repository = "https://github.com/proxynico/rami"
homepage = "https://github.com/proxynico/rami"
readme = "README.md"
keywords = ["macos", "system-monitor", "memory", "cpu", "gpu"]
categories = ["command-line-utilities", "os::macos-apis"]

[lib]
name = "rami"
path = "src/lib.rs"

[[bin]]
name = "rami"
path = "src/main.rs"

[dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "block2",
  "NSAppearance",
  "NSApplication",
  "NSAttributedString",
  "NSBezierPath",
  "NSBitmapImageRep",
  "NSCell",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSFont",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSPasteboard",
  "NSParagraphStyle",
  "NSRunningApplication",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSText",
  "NSView",
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3", features = [
  "NSError",
  "NSAttributedString",
  "NSObject",
  "NSRunLoop",
  "NSString",
  "NSTimer",
  "NSUserDefaults",
] }
mach2 = "0.6"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
