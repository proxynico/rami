name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize, and publish DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Import Developer ID signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12_PATH="$RUNNER_TEMP/cert.p12"

          printf '%s' "$P12_BASE64" | base64 --decode > "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Prepend the build keychain to the user search list so codesign can find the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm "$P12_PATH"

      - name: Build, sign, notarize, and staple DMG
        env:
          RAMI_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          RAMI_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          RAMI_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          RAMI_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: ./scripts/release.sh

      - name: Upload DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/rami-*.dmg
            dist/rami-*.dmg.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload DMG as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rami-dmg
          path: dist/rami-*.dmg
          retention-days: 14

  update-tap:
    name: Bump Homebrew Cask
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - name: Checkout rami
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render Cask and push to tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN secret not set; skipping Homebrew tap bump." >&2
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          dmg_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/rami-${version}.dmg"
          echo "==> Downloading published DMG to compute sha256"
          curl -fsSL -o rami.dmg "$dmg_url"
          sha="$(shasum -a 256 rami.dmg | awk '{print $1}')"
          echo "==> Rendering Cask for ${version} (${sha})"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/proxynico/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s|^  version .*|  version \"${version}\"|" \
              -e "s|^  sha256 .*|  sha256 \"${sha}\"|" \
              Casks/rami.rb > tap/Casks/rami.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/rami.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
          else
            git commit -m "rami ${version}"
            git push
          fi
